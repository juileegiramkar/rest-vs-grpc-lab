syntax = "proto3";

package order.v1;

// Order Service contract for the gRPC version.
// gRPC equivalent of `POST /orders` and `GET /health` in the REST version.
service OrderService {
  // Places an order after checking stock with InventoryService.CheckAvailability.
  //
  // Error statuses:
  //   INVALID_ARGUMENT    - item_id is empty or quantity < 1
  //   NOT_FOUND           - item_id is not in the catalog (from Inventory)
  //   FAILED_PRECONDITION - not enough units in stock (from Inventory)
  //   DEADLINE_EXCEEDED   - Inventory did not answer before the Order -> Inventory deadline
  //   UNAVAILABLE         - Inventory could not be reached
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);

  // Liveness check, used to show the Order Service is still up after Inventory failures.
  rpc Health(HealthRequest) returns (HealthResponse);
}

message PlaceOrderRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message PlaceOrderResponse {
  string order_id = 1;
  string status = 2;
  string item_id = 3;
  int32 quantity = 4;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  int32 pid = 2;
  double uptime_seconds = 3;
  int32 orders_confirmed = 4;
  int32 orders_rejected = 5;
  int32 inventory_errors = 6;
}
